            margin-bottom: 5px;

        }
        .canva-item {

        }

            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        .canva-credits {
            font-size: 0.85rem;

            margin-top: 6px;
        }
        .canva-credits a {
            color: #2e7d32;
            text-decoration: none;
            font-weight: bold;
        }
        .canva-credits a:hover {
            text-decoration: underline;
        }
        /* 專屬列表樣式 */
        .resource-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .resource-list li {
            margin-bottom: 12px;
        }
        .resource-list a {
            display: block;
            color: #444;
            text-decoration: none;
            padding: 10px 15px;
            background: #f9f9f9;
            border-radius: 6px;
            transition: all 0.2s;
            border: 1px solid #eee;
        }
        .resource-list a:hover {
            background: #e8f5e9;
            color: #2e7d32;
            border-color: #c8e6c9;
            transform: translateX(5px);
