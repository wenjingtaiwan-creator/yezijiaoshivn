<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教學資源與電子書</title>
  <style>
    body {
      margin: 0;
      padding: 32px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      line-height: 1.6;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      margin-bottom: 24px;
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }
    .back-link:hover {
      text-decoration: underline;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
      padding: 24px;
      margin-bottom: 32px;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 1.5rem;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 8px;
    }
    .fp-iframe {
      width: 100%;
      height: 550px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
    }
    .canva-wrapper {
      position: relative;
      width: 100%;
      height: 0;
      padding-top: 75%;
      box-shadow: 0 2px 8px 0 rgba(63,69,81,0.16);
      margin-top: 1.2em;
      margin-bottom: 0.9em;
      overflow: hidden;
      border-radius: 8px;
    }
    .canva-wrapper iframe {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      border: none;
      padding: 0;
      margin: 0;
    }
    .caption {
      font-size: 0.95rem;
      color: #64748b;
    }
    .caption a {
      color: #2563eb;
      text-decoration: none;
    }
    .caption a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-link">← 返回首頁</a>

    <!-- 電子書展示區塊 -->
    <div class="card">
      <h2>電子書教材</h2>
      <iframe allowfullscreen="allowfullscreen" allow="autoplay; fullscreen; clipboard-write" scrolling="no" class="fp-iframe" src="https://heyzine.com/flip-book/2fd1bc3435.html"></iframe>
    </div>

    <!-- 教學簡報區塊 -->
    <div class="card">
      <h2>教學簡報</h2>
      <div class="canva-wrapper">
        <iframe loading="lazy" src="https://www.canva.com/design/DAHUkb84nVg/h1AfA9tK6kJuo7A82i6bIw/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen"></iframe>
      </div>
      <div class="caption">
        葉文靜 設計的 <a href="https://www.canva.com/design/DAHUkb84nVg/h1AfA9tK6kJuo7A82i6bIw/view?utm_content=DAHUkb84nVg&amp;utm_campaign=designshare&amp;utm_medium=embeds&amp;utm_source=link" target="_blank" rel="noopener">2-字母與拼讀法.pptx</a>
      </div>
    </div>
  </div>

</body>
</html>
